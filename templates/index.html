<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Medical Image App</title>
</head>
<body>
    <h2>Upload Medical Image</h2>
    <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="image" required>
        <input type="submit" value="Upload">
    </form>
    {% if uploaded %}
        <h3>Original Image:</h3>
        <img src="{{ url_for('static', filename='uploads/' + uploaded) }}" alt="Uploaded Image" width="300">
    {% endif %}
    {% if processed %}
        <h3>Processed Image:</h3>
        <img src="{{ url_for('static', filename='uploads/' + processed) }}" alt="Processed Image" width="300">
    {% endif %}
</body>
</html>
