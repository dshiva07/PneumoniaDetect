<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Medical Image Analyzer</title>
    <style>
        body {
            font-family: Arial;
            margin: 20px;
            text-align: center;
            background: #f4f4f4;
        }
        h2 {
            color: #333;
        }
        form {
            margin-bottom: 20px;
        }
        img {
            border: 1px solid #ccc;
            margin-top: 10px;
            border-radius: 8px;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <h2>AI Medical Image Analyzer</h2>
            <form action="/upload" method="post" enctype="multipart/form-data">
                <input type="file" name="image" required>
                <br><br>
                <button type="submit" value="Analyze">Analyze</button>
            </form>

            {% if error %}
                <h3 style="color: red;">{{ error }}</h3>
            {% endif %}

            {% if prediction %}
                <h3>AI Prediction: {{ prediction }}</h3>
                <p>Confidence: {{ '%.2f'|format(confidence * 100) }}%</p>
            {% endif %}
        </div>

        {% if uploaded %}
            <div class="Original">
                <h3>Original Image:</h3>
                <img src="{{ url_for('static', filename='uploads/' + uploaded) }}" alt="Uploaded Image" width="300">
            </div>
        {% endif %}

        {% if processed %}
            <div>
                <h3>Processed Image:</h3>
                <img src="{{ url_for('static', filename='uploads/' + processed) }}" alt="Processed Image" width="300">
            </div>
        {% endif %}
    </div>
</body>
</html>
